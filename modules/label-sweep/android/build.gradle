plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.labelsweep'
version = '0.1.0'

android {
  namespace "expo.modules.labelsweep"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

// CameraX at the version expo-camera ships (read from its published POM), so
// the app carries one CameraX, not two that disagree.
def camerax_version = '1.6.0'

// As expo-camera does, for the same reason: CameraX 1.6.0 needs
// listenablefuture:1.0 at compile time, and the React Native Gradle plugin's
// full Guava forces it to 9999.0-empty, an intentionally empty jar.
configurations.configureEach {
  resolutionStrategy.force "com.google.guava:listenablefuture:1.0"
}

dependencies {
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
  implementation "androidx.appcompat:appcompat:1.7.1"

  // The same on-device text model as the single capture, through Play
  // Services, and the same mapping of its lines (`describeLine`).
  implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
  implementation project(':label-ocr')
}
